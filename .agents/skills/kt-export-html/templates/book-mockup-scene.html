<!DOCTYPE html>
<!--
  Generic 3D book mockup scene - render to transparent PNG via headless Chrome.
  See references/css-3d-mockup-to-png.md for the exact render command.
  Customize: CSS vars in :root (colors, --T thickness), cover texts, title font.
  Canvas: 1000x1200 fixed so the screenshot is predictable.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Book 3D Mockup Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --cover: #F4C430;          /* main cover color */
    --cover-hi: #FFE066;       /* cover highlight */
    --cover-deep: #D9A90E;     /* cover shadow side */
    --spine-dark: #7a5c04;
    --paper: #f5efe0;
    --paper-line: #ddd3ba;
    --ink: #0F0F0F;            /* cover text color */
    --font-sans: 'Roboto', system-ui, sans-serif;
    --font-brush: 'Caveat', cursive;   /* swap for the real cover font if available */
    --T: 64px;                 /* book thickness */
    --W: 420px;                /* cover width  */
    --H: 620px;                /* cover height */
    --rotY: -32deg;            /* negative = spine on the left */
    --rotX: 11deg;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ background: transparent; }
  body.dark{ background: radial-gradient(750px 560px at 50% 32%, #3d3d3d 0%, #2B2B2B 70%); }

  .scene{
    width: 1000px; height: 1200px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    font-family: var(--font-sans);
  }

  .floor-shadow{
    position: absolute; left: 50%; bottom: 158px;
    width: 470px; height: 74px;
    transform: translateX(-50%) skewX(-16deg);
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,.55) 0%, rgba(0,0,0,.28) 45%, transparent 72%);
    filter: blur(14px);
  }

  .book{
    position: relative;
    width: var(--W); height: var(--H);
    transform-style: preserve-3d;
    transform: rotateY(var(--rotY)) rotateX(var(--rotX));
    margin-left: 40px; /* optically re-center the rotated book; tune per angle */
  }
  .face{ position: absolute; }

  .front{
    inset: 0; transform: translateZ(var(--T));
    border-radius: 5px 12px 12px 5px;
    background: radial-gradient(150% 110% at 28% 0%,
      var(--cover-hi) 0%, var(--cover) 46%, var(--cover-deep) 100%);
    padding: 36px 30px 30px 42px;
    display: flex; flex-direction: column;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.07);
    overflow: hidden;
  }
  .front::after{   /* sheen */
    content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(115deg,
      rgba(255,255,255,.38) 0%, rgba(255,255,255,.06) 24%, transparent 42%);
  }
  .back{
    inset: 0; transform: translateZ(0);
    background: linear-gradient(120deg, var(--cover-deep), var(--spine-dark));
    border-radius: 5px 12px 12px 5px;
  }
  .spine{
    top:0; bottom:0; left:0; width: var(--T);
    transform: rotateY(-90deg); transform-origin: left center;
    background: linear-gradient(90deg, var(--spine-dark) 0%, var(--cover-deep) 100%);
    border-radius: 5px 0 0 5px;
  }
  .spine-text{
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%) rotate(90deg);
    white-space: nowrap; font-weight: 900; font-size: 15px;
    letter-spacing: 4px; color: rgba(0,0,0,.72);
  }
  .pages{          /* right edge */
    top:6px; bottom:6px; right:0; width: var(--T);
    transform: rotateY(90deg); transform-origin: right center;
    background: repeating-linear-gradient(90deg, var(--paper) 0 2px, var(--paper-line) 2px 4px);
  }
  .pages::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(90deg,
      rgba(0,0,0,.16), transparent 32%, transparent 72%, rgba(0,0,0,.26));
  }
  .pages-top, .pages-bottom{
    left:5px; right:5px; height: var(--T);
    background: repeating-linear-gradient(0deg, var(--paper) 0 2px, var(--paper-line) 2px 4px);
  }
  .pages-top{ top:0; transform: rotateX(90deg); transform-origin: top center; }
  .pages-bottom{ bottom:0; transform: rotateX(-90deg); transform-origin: bottom center; }

  /* ---- cover content: replace with real copy ---- */
  .kicker{ font-size:12px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:rgba(0,0,0,.72); line-height:1.55; }
  .cover-title{
    font-family: var(--font-brush); font-weight:700;
    font-size:118px; line-height:.95; color:var(--ink);
    margin:auto 0; transform: rotate(-1.5deg); letter-spacing:-1px;
    text-shadow: 2px 2px 0 rgba(255,255,255,.25);
  }
  .subtitle{ font-size:14.5px; font-weight:900; letter-spacing:.9px; text-transform:uppercase; color:var(--ink); line-height:1.5; max-width:26ch; }
  .authors{
    margin-top:14px; padding-top:12px;
    border-top:2.5px solid rgba(0,0,0,.75);
    font-size:13px; font-weight:700; letter-spacing:1.8px;
    text-transform:uppercase; color:rgba(0,0,0,.85);
  }
</style>
</head>
<body>
<script>if (location.search.includes('bg=dark')) document.body.classList.add('dark');</script>

<div class="scene">
  <div class="floor-shadow"></div>
  <div class="book">
    <div class="face back"></div>
    <div class="face spine"><span class="spine-text">BOOK TITLE</span></div>
    <div class="face pages"></div>
    <div class="face pages-top"></div>
    <div class="face pages-bottom"></div>
    <div class="face front">
      <p class="kicker">Kicker line / endorsement</p>
      <h1 class="cover-title">Book Title</h1>
      <p class="subtitle">Subtitle goes here in uppercase</p>
      <p class="authors">Author One / Author Two</p>
    </div>
  </div>
</div>

</body>
</html>
